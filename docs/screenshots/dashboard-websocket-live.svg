<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card-bg { fill: #151D2F; stroke: #212E48; stroke-width: 1.5; rx: 10px; }
      .table-hdr-bg { fill: #101726; }
      .border-line { stroke: #212E48; stroke-width: 1; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #F3F4F6; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #9CA3AF; letter-spacing: 0.5px; }
      .text-kpi-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #FFFFFF; }
      .text-kpi-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #6B7280; letter-spacing: 0.8px; }
      .text-kpi-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #10B981; }
      .text-danger { fill: #EF4444; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #E5E7EB; }
      .text-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #93C5FD; }
      .badge-ws { fill: #064E3B; stroke: #10B981; stroke-width: 1; rx: 12px; }
      .text-ws { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #34D399; }
      .badge-crit { fill: #7F1D1D; rx: 4px; }
      .text-crit { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #FCA5A5; }
      .badge-high { fill: #78350F; rx: 4px; }
      .text-high { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #FCD34D; }
      .btn-resolve { fill: #1E293B; stroke: #334155; rx: 5px; }
      .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #94A3B8; }
      .tab-active-bg { fill: #1D4ED8; rx: 6px; }
      .tab-active-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .tab-inactive-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #6B7280; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="780" class="bg"/>

  <!-- Top Header Bar -->
  <g transform="translate(30, 24)">
    <text x="0" y="24" class="text-title">⚡ Kappa vs. Lambda Architecture Real-Time Operations</text>
    
    <!-- Live WebSocket Pill -->
    <g transform="translate(565, 6)">
      <rect width="195" height="24" class="badge-ws"/>
      <circle cx="14" cy="12" r="4" fill="#10B981"/>
      <text x="26" y="16" class="text-ws">⚡ WEBSOCKET LIVE STREAM</text>
    </g>

    <!-- Header Navigation Links -->
    <g transform="translate(860, 16)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#3B82F6">OpenAPI 3 Docs</text>
      <text x="110" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">Actuator</text>
      <text x="180" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">Prometheus</text>
      <text x="270" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">Redpanda</text>
    </g>
    <line x1="0" y1="42" x2="1140" y2="42" class="border-line"/>
  </g>

  <!-- KPI Cards (Row 1) -->
  <g transform="translate(30, 85)">
    <!-- Card 1: Active Accounts -->
    <g transform="translate(0, 0)">
      <rect width="265" height="96" class="card-bg"/>
      <text x="20" y="26" class="text-kpi-lbl">ACTIVE ACCOUNTS</text>
      <text x="20" y="62" class="text-kpi-val">12</text>
      <text x="20" y="82" class="text-kpi-note">↑ Streaming partitions active</text>
    </g>

    <!-- Card 2: Aggregated Transactions -->
    <g transform="translate(290, 0)">
      <rect width="265" height="96" class="card-bg"/>
      <text x="20" y="26" class="text-kpi-lbl">AGGREGATED TRANSACTIONS</text>
      <text x="20" y="62" class="text-kpi-val">148,290</text>
      <text x="20" y="82" class="text-kpi-note">↑ 100 tx/sec continuous ingest</text>
    </g>

    <!-- Card 3: Total Monetary Volume -->
    <g transform="translate(580, 0)">
      <rect width="265" height="96" class="card-bg"/>
      <text x="20" y="26" class="text-kpi-lbl">TOTAL AGGREGATED VOLUME (USD)</text>
      <text x="20" y="62" class="text-kpi-val" fill="#60A5FA">$4,912,480.25</text>
      <text x="20" y="82" class="text-kpi-note">↑ Real-time tumbling windows</text>
    </g>

    <!-- Card 4: Unresolved Fraud Alerts -->
    <g transform="translate(870, 0)">
      <rect width="270" height="96" class="card-bg"/>
      <text x="20" y="26" class="text-kpi-lbl">UNRESOLVED FRAUD ALERTS</text>
      <text x="20" y="62" class="text-kpi-val text-danger">3</text>
      <text x="20" y="82" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#EF4444">⚠️ Immediate action required</text>
    </g>
  </g>

  <!-- Navigation Tabs -->
  <g transform="translate(30, 202)">
    <rect x="0" y="0" width="205" height="32" class="tab-active-bg"/>
    <text x="22" y="20" class="tab-active-text">⚡ Kappa Streaming View</text>

    <text x="235" y="20" class="tab-inactive-text">📊 Lambda Dual-Layer Merged View</text>
    <text x="470" y="20" class="tab-inactive-text">⚖️ Architectural Decision Matrix</text>
  </g>

  <!-- Main Content Grid -->
  <g transform="translate(30, 250)">
    <!-- Left Column: Real-Time Fraud Alerts Table (WebSocket Push) -->
    <g transform="translate(0, 0)">
      <rect width="680" height="465" class="card-bg"/>
      <text x="24" y="32" class="text-title" font-size="15">🚨 Real-Time Fraud Alert Feed (WebSocket Push)</text>
      <text x="24" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#9CA3AF">Sub-second event detection via Strategy Pattern engine</text>

      <!-- Table Header -->
      <g transform="translate(20, 68)">
        <rect width="640" height="30" class="table-hdr-bg" rx="4"/>
        <text x="12" y="20" class="text-sub">TIMESTAMP</text>
        <text x="115" y="20" class="text-sub">ACCOUNT</text>
        <text x="220" y="20" class="text-sub">TRIGGERED RULE</text>
        <text x="450" y="20" class="text-sub">SEVERITY</text>
        <text x="560" y="20" class="text-sub">ACTION</text>
      </g>

      <!-- Row 1 (Critical Spiked Transaction) -->
      <g transform="translate(20, 108)">
        <rect width="640" height="52" fill="#18233C" rx="4"/>
        <line x1="0" y1="52" x2="640" y2="52" class="border-line"/>
        <text x="12" y="31" class="text-body" fill="#9CA3AF">22:04:18.421</text>
        <text x="115" y="31" class="text-mono" font-weight="600">ACC-1002</text>
        <text x="220" y="24" class="text-body" font-weight="600">RULE_LARGE_AMOUNT_SPIKE</text>
        <text x="220" y="42" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">Amount $12,500.00 &gt; $10,000 threshold</text>
        
        <rect x="450" y="17" width="68" height="20" class="badge-crit"/>
        <text x="461" y="31" class="text-crit">CRITICAL</text>

        <rect x="560" y="14" width="65" height="26" class="btn-resolve"/>
        <text x="575" y="31" class="btn-text">Resolve</text>
      </g>

      <!-- Row 2 (Impossible Travel) -->
      <g transform="translate(20, 170)">
        <rect width="640" height="52" fill="#151D2F" rx="4"/>
        <line x1="0" y1="52" x2="640" y2="52" class="border-line"/>
        <text x="12" y="31" class="text-body" fill="#9CA3AF">22:04:15.118</text>
        <text x="115" y="31" class="text-mono" font-weight="600">ACC-1005</text>
        <text x="220" y="24" class="text-body" font-weight="600">RULE_IMPOSSIBLE_TRAVEL</text>
        <text x="220" y="42" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">NYC to London (5,570 km) in 120s</text>
        
        <rect x="450" y="17" width="50" height="20" class="badge-high"/>
        <text x="461" y="31" class="text-high">HIGH</text>

        <rect x="560" y="14" width="65" height="26" class="btn-resolve"/>
        <text x="575" y="31" class="btn-text">Resolve</text>
      </g>

      <!-- Row 3 (Velocity Burst) -->
      <g transform="translate(20, 232)">
        <rect width="640" height="52" fill="#151D2F" rx="4"/>
        <line x1="0" y1="52" x2="640" y2="52" class="border-line"/>
        <text x="12" y="31" class="text-body" fill="#9CA3AF">22:04:09.890</text>
        <text x="115" y="31" class="text-mono" font-weight="600">ACC-1008</text>
        <text x="220" y="24" class="text-body" font-weight="600">RULE_HIGH_VELOCITY_BURST</text>
        <text x="220" y="42" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">4 rapid transactions within 6.2s window</text>
        
        <rect x="450" y="17" width="50" height="20" class="badge-high"/>
        <text x="461" y="31" class="text-high">HIGH</text>

        <rect x="560" y="14" width="65" height="26" class="btn-resolve"/>
        <text x="575" y="31" class="btn-text">Resolve</text>
      </g>

      <!-- Row 4 (Resolved Alert Example) -->
      <g transform="translate(20, 294)">
        <rect width="640" height="52" fill="#151D2F" rx="4" opacity="0.6"/>
        <line x1="0" y1="52" x2="640" y2="52" class="border-line"/>
        <text x="12" y="31" class="text-body" fill="#6B7280">22:01:45.310</text>
        <text x="115" y="31" class="text-mono" fill="#6B7280">ACC-1001</text>
        <text x="220" y="24" class="text-body" fill="#6B7280">RULE_LARGE_AMOUNT_SPIKE</text>
        <text x="220" y="42" font-family="-apple-system, sans-serif" font-size="11" fill="#4B5563">Resolved by analyst_1 • Cardholder verified</text>
        
        <rect x="450" y="17" width="62" height="20" fill="#1E293B" rx="4"/>
        <text x="458" y="31" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B">RESOLVED</text>

        <text x="565" y="32" font-family="-apple-system, sans-serif" font-size="11" fill="#4B5563">Archived</text>
      </g>
    </g>

    <!-- Right Column: Rolling Tumbling Window Aggregations -->
    <g transform="translate(705, 0)">
      <rect width="435" height="465" class="card-bg"/>
      <text x="20" y="32" class="text-title" font-size="15">📈 Real-Time 1-Min Tumbling Windows</text>
      
      <!-- Account Dropdown Selector Mockup -->
      <g transform="translate(20, 48)">
        <rect width="180" height="28" fill="#1F293D" stroke="#374151" rx="4"/>
        <text x="10" y="18" font-family="-apple-system, sans-serif" font-size="11" fill="#E5E7EB">Account: ACC-1002 (Active)</text>
        <text x="160" y="18" font-family="-apple-system, sans-serif" font-size="10" fill="#9CA3AF">▼</text>
      </g>

      <!-- Table Header -->
      <g transform="translate(20, 90)">
        <rect width="395" height="28" class="table-hdr-bg" rx="4"/>
        <text x="10" y="18" class="text-sub">WINDOW START</text>
        <text x="125" y="18" class="text-sub">TX COUNT</text>
        <text x="210" y="18" class="text-sub">SUM (USD)</text>
        <text x="315" y="18" class="text-sub">MAX TX</text>
      </g>

      <!-- Window Rows -->
      <g transform="translate(20, 126)">
        <rect width="395" height="38" fill="#18233C" rx="4"/>
        <text x="10" y="24" class="text-mono">22:04:00 UTC</text>
        <text x="135" y="24" class="text-body" font-weight="600">42</text>
        <text x="210" y="24" class="text-body" font-weight="700" fill="#60A5FA">$158,400.00</text>
        <text x="315" y="24" class="text-body" fill="#FCA5A5">$12,500.00</text>
      </g>

      <g transform="translate(20, 172)">
        <rect width="395" height="38" fill="#151D2F" rx="4"/>
        <text x="10" y="24" class="text-mono">22:03:00 UTC</text>
        <text x="135" y="24" class="text-body" font-weight="600">38</text>
        <text x="210" y="24" class="text-body" font-weight="700" fill="#60A5FA">$42,120.50</text>
        <text x="315" y="24" class="text-body">$2,400.00</text>
      </g>

      <g transform="translate(20, 218)">
        <rect width="395" height="38" fill="#151D2F" rx="4"/>
        <text x="10" y="24" class="text-mono">22:02:00 UTC</text>
        <text x="135" y="24" class="text-body" font-weight="600">45</text>
        <text x="210" y="24" class="text-body" font-weight="700" fill="#60A5FA">$51,900.20</text>
        <text x="315" y="24" class="text-body">$3,100.00</text>
      </g>

      <g transform="translate(20, 264)">
        <rect width="395" height="38" fill="#151D2F" rx="4"/>
        <text x="10" y="24" class="text-mono">22:01:00 UTC</text>
        <text x="135" y="24" class="text-body" font-weight="600">31</text>
        <text x="210" y="24" class="text-body" font-weight="700" fill="#60A5FA">$38,750.00</text>
        <text x="315" y="24" class="text-body">$1,850.00</text>
      </g>

      <!-- Mini Architecture Badge -->
      <g transform="translate(20, 320)">
        <rect width="395" height="120" fill="#0D1424" stroke="#1E2B48" rx="6"/>
        <text x="15" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#A78BFA">💡 Kappa Stream Serving Mechanics</text>
        <text x="15" y="46" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">• Sliding window state maintained in Stream Processor RAM</text>
        <text x="15" y="66" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">• Idempotent upserts flushed to PostgreSQL serving tables</text>
        <text x="15" y="86" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">• WebSocket pushes delta stats directly to browser every 1000ms</text>
        <text x="15" y="106" font-family="-apple-system, sans-serif" font-size="11" fill="#34D399">• Zero batch reconciliation lag — instant real-time consistency</text>
      </g>
    </g>
  </g>

  <!-- Bottom Global Status Footer -->
  <g transform="translate(30, 735)">
    <text x="0" y="15" font-family="JetBrains Mono, monospace" font-size="11" fill="#6B7280">Redpanda: localhost:9092 [payment.transactions.v1]  |  Serving API: localhost:8082 [/ws/events]  |  WebSocket Latency: ~12ms</text>
  </g>
</svg>

